          <article class="essay"><header class="essay-header"><div class="essay-meta"><a href="../../ai/" class="essay-topic">AI</a></div><h1>把 AI 当作智力的杠杆</h1></header>
          <figure class="research-figure essay-cover"><div class="art-paper"><img src="../../../assets/cover-ai-leverage.jpg" srcset="../../../assets/cover-ai-leverage-small.jpg 720w, ../../../assets/cover-ai-leverage.jpg 1440w" sizes="(max-width: 1244px) 90vw, 1120px" width="1440" height="576" alt="一个人借助笔记与 AI 工作台，把想法变成图表、网页与软件。" decoding="async"></div></figure><div class="essay-body"><div class="essay-prose"><p>想做个自用工具，我会先让 AI 找几个现成的。挑一个最顺手的，再按自己的需要改。</p><p>以前有些想法一直搁着，总觉得得先学会写代码。现在可以先做个自己能用的版本。用一遍，我通常就说得清哪里别扭、下一步想改什么了。</p></div></div>
