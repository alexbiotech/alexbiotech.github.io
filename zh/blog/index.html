        <div class="reading-layout reading-layout-wide"><h1>博客</h1><div class="reading-copy"><p class="lead span-all">关于 AI、主动行动与生物设计的思考。</p><div class="note-grid span-all"><a href="ai-as-intellectual-leverage/" class="note-card" data-spotlight aria-label="把 AI 当作智力的杠杆"><div class="art-paper"><img src="../../assets/cover-ai-leverage.jpg" srcset="../../assets/cover-ai-leverage-small.jpg 720w, ../../assets/cover-ai-leverage.jpg 1440w" sizes="(max-width: 700px) 90vw, 30vw" width="1440" height="576" alt="" decoding="async"></div><span class="note-category">AI</span><h2>把 AI 当作智力的杠杆</h2><p>AI 让更多人有能力把想法做出来。对问题理解越深，越能发挥它的杠杆作用。</p><span class="note-read"><span class="link-mark">阅读全文</span></span></a><a href="goals-tools-and-feedback/" class="note-card" data-spotlight aria-label="从理解走向行动"><div class="art-paper"><img src="../../assets/cover-agency.jpg" srcset="../../assets/cover-agency-small.jpg 720w, ../../assets/cover-agency.jpg 1440w" sizes="(max-width: 700px) 90vw, 30vw" width="1440" height="576" alt="" decoding="async"></div><span class="note-category">悟道</span><h2>从理解走向行动</h2><p>主动性体现在行动、检验和调整之中，也体现在对最终结果负责。</p><span class="note-read"><span class="link-mark">阅读全文</span></span></a><a href="from-encoded-function-to-realized-function/" class="note-card" data-spotlight aria-label="从编码功能，到实现功能"><div class="art-paper"><img src="../../assets/cover-biotech.jpg" srcset="../../assets/cover-biotech-small.jpg 720w, ../../assets/cover-biotech.jpg 1440w" sizes="(max-width: 700px) 90vw, 30vw" width="1440" height="576" alt="" decoding="async"></div><span class="note-category">生物科技</span><h2>从编码功能，到实现功能</h2><p>理解生物设计，需要把设计意图、递送过程与实际功能放在同一条路径上。</p><span class="note-read"><span class="link-mark">阅读全文</span></span></a></div></div></div>
