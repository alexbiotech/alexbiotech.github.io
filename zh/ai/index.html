        <div class="reading-layout reading-layout-wide"><h1>AI</h1><div class="reading-copy"><p class="lead">AI 是智力的杠杆，让一个人能做成更多事。</p><figure class="research-figure "><div class="art-paper"><img src="../../assets/ai-leverage.jpg" srcset="../../assets/ai-leverage-small.jpg 720w, ../../assets/ai-leverage.jpg 1440w" sizes="(max-width: 700px) 90vw, 46vw" width="1440" height="576" alt="人以 AI 为杠杆，把想法转化为数据分析、网页和软件的手绘图。" decoding="async"></div></figure><section class="core-view" data-spotlight><h2>理解越深，杠杆越有力</h2><p>理解问题，问得清楚，判断结果。</p></section>
<section class="core-view" data-spotlight><h2>让更多人掌握技术</h2><p>AI 降低分析、编程与设计的门槛，让更多人掌握技术，把想法做出来。</p></section><section class="span-all"><h2>让一个人能做成更多事</h2><ul class="application-grid"><li><h3>数据分析</h3></li><li><h3>编程与工具</h3></li><li><h3>设计与表达</h3></li><li><h3>科学探索</h3></li></ul></section><section class="illustrated-section span-all"><div><h2>从想法到真正做出来</h2><p>说清想法，做出初版，在使用中改进。</p></div><figure class="research-figure "><div class="art-paper"><img src="../../assets/idea-to-action.jpg" srcset="../../assets/idea-to-action-small.jpg 720w, ../../assets/idea-to-action.jpg 1440w" sizes="(max-width: 700px) 90vw, 46vw" width="1440" height="576" alt="粗略草图经过人引导的 AI 工作台，成为可以使用的网页。" decoding="async"></div></figure></section><section class="related-notes span-all"><h2>延伸阅读</h2><div class="related-grid"><section data-spotlight><h3><a href="../blog/ai-as-intellectual-leverage/" class="statement-link">把 AI 当作智力的杠杆</a></h3></section><section data-spotlight><h3><a href="../blog/goals-tools-and-feedback/" class="statement-link">从理解走向行动</a></h3></section></div></section></div></div>
